<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d4d4d"/>
    </marker>
    <style>
      .title{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:24px;font-weight:700;fill:#0b257f}
      .text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:17px;fill:#222}
      .small{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:13px;fill:#555}
      .box{fill:#f8fbff;stroke:#7faed8;stroke-width:2;rx:6}
      .file{fill:#f7faf7;stroke:#6da874;stroke-width:2;rx:6}
      .line{stroke:#4d4d4d;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .code{font-family:"Noto Sans Mono CJK SC","Consolas",monospace;font-size:12px;fill:#333}
    </style>
  </defs>
  <rect width="960" height="440" fill="#fff"/>
  <text x="480" y="42" text-anchor="middle" class="title">完成采集后只要确认这一个结果文件</text>
  <rect x="70" y="104" width="220" height="96" class="box"/>
  <text x="180" y="138" text-anchor="middle" class="text">点击“完成采集”</text>
  <text x="180" y="166" text-anchor="middle" class="small">状态显示 compute done</text>
  <rect x="370" y="90" width="250" height="124" class="file"/>
  <text x="495" y="124" text-anchor="middle" class="text">handeye_result.yaml</text>
  <text x="495" y="152" text-anchor="middle" class="small">标定结果文件</text>
  <text x="495" y="176" text-anchor="middle" class="small">里面必须有 tool_camera_matrix</text>
  <rect x="700" y="104" width="200" height="96" class="box"/>
  <text x="800" y="138" text-anchor="middle" class="text">验证 / 抓取时使用</text>
  <text x="800" y="166" text-anchor="middle" class="small">命令中填这个文件路径</text>
  <path d="M290 152 L370 152" class="line"/>
  <path d="M620 152 L700 152" class="line"/>
  <rect x="120" y="270" width="720" height="86" fill="#f4f4f4" stroke="#bfbfbf" rx="5"/>
  <text x="150" y="303" class="code">calibration_data/handeye/&lt;session&gt;/results/handeye_result.yaml</text>
  <text x="150" y="332" class="code">ros2 launch gas_bringup grasp_pipeline.launch.py handeye_result_file:=这个路径</text>
</svg>
