<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d4d4d"/>
    </marker>
    <style>
      .title{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:24px;font-weight:700;fill:#0b257f}
      .text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:18px;fill:#222}
      .small{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:14px;fill:#555}
      .box{fill:#f8fbff;stroke:#7faed8;stroke-width:2;rx:6}
      .ok{fill:#f3fbf4;stroke:#6da874;stroke-width:2;rx:6}
      .warn{fill:#fff8ee;stroke:#c99a43;stroke-width:2;rx:6}
      .line{stroke:#4d4d4d;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .table{fill:#f4f4f4;stroke:#999;stroke-width:1.5;rx:4}
      .marker{fill:#111}
    </style>
  </defs>
  <rect width="960" height="520" fill="#fff"/>
  <text x="480" y="42" text-anchor="middle" class="title">标定前摆放示意</text>
  <rect x="76" y="96" width="200" height="118" class="box"/>
  <text x="176" y="135" text-anchor="middle" class="text">电脑</text>
  <text x="176" y="166" text-anchor="middle" class="small">运行标定程序</text>
  <text x="176" y="188" text-anchor="middle" class="small">显示采集 GUI</text>
  <rect x="370" y="88" width="250" height="160" class="ok"/>
  <text x="495" y="123" text-anchor="middle" class="text">机器人末端 + 相机</text>
  <rect x="478" y="145" width="70" height="44" fill="#d9eaf7" stroke="#1672c5" stroke-width="2" rx="4"/>
  <circle cx="513" cy="167" r="14" fill="#0b257f"/>
  <rect x="436" y="194" width="120" height="22" fill="#e8e8e8" stroke="#777"/>
  <text x="495" y="235" text-anchor="middle" class="small">只移动机器人末端</text>
  <rect x="736" y="106" width="150" height="118" class="table"/>
  <text x="811" y="91" text-anchor="middle" class="text">Charuco 标定板</text>
  <g transform="translate(766,132)">
    <rect width="90" height="64" fill="#fff" stroke="#222"/>
    <rect x="0" y="0" width="9" height="9" class="marker"/><rect x="18" y="0" width="9" height="9" class="marker"/><rect x="36" y="0" width="9" height="9" class="marker"/><rect x="54" y="0" width="9" height="9" class="marker"/><rect x="72" y="0" width="9" height="9" class="marker"/>
    <rect x="9" y="9" width="9" height="9" class="marker"/><rect x="27" y="9" width="9" height="9" class="marker"/><rect x="45" y="9" width="9" height="9" class="marker"/><rect x="63" y="9" width="9" height="9" class="marker"/><rect x="81" y="9" width="9" height="9" class="marker"/>
    <rect x="0" y="27" width="9" height="9" class="marker"/><rect x="18" y="27" width="9" height="9" class="marker"/><rect x="36" y="27" width="9" height="9" class="marker"/><rect x="54" y="27" width="9" height="9" class="marker"/><rect x="72" y="27" width="9" height="9" class="marker"/>
    <rect x="9" y="45" width="9" height="9" class="marker"/><rect x="27" y="45" width="9" height="9" class="marker"/><rect x="45" y="45" width="9" height="9" class="marker"/><rect x="63" y="45" width="9" height="9" class="marker"/><rect x="81" y="45" width="9" height="9" class="marker"/>
  </g>
  <text x="811" y="248" text-anchor="middle" class="small">固定不动</text>
  <path d="M276 155 L370 155" class="line"/>
  <path d="M620 168 L736 168" class="line"/>
  <text x="670" y="150" text-anchor="middle" class="small">相机看标定板</text>
  <rect x="92" y="322" width="246" height="96" class="warn"/>
  <text x="215" y="356" text-anchor="middle" class="text">1. 先确认安全</text>
  <text x="215" y="386" text-anchor="middle" class="small">急停可用，周围无人靠近</text>
  <rect x="358" y="322" width="246" height="96" class="warn"/>
  <text x="481" y="356" text-anchor="middle" class="text">2. 固定标定板</text>
  <text x="481" y="386" text-anchor="middle" class="small">采集过程中保持固定</text>
  <rect x="624" y="322" width="246" height="96" class="warn"/>
  <text x="747" y="356" text-anchor="middle" class="text">3. 移动相机</text>
  <text x="747" y="386" text-anchor="middle" class="small">每个角度点一次采集</text>
</svg>
