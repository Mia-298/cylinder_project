<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
  <style>
    .title{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:24px;font-weight:700;fill:#0b257f}
    .text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:18px;fill:#222}
    .small{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:14px;fill:#555}
    .frame{fill:#20242b;stroke:#777;stroke-width:2;rx:6}
    .ok{fill:#f3fbf4;stroke:#6da874;stroke-width:2;rx:5}
    .bad{fill:#fff7f7;stroke:#c55;stroke-width:2;rx:5}
    .marker{fill:#111}
    .green{fill:#30c050}
  </style>
  <rect width="960" height="520" fill="#fff"/>
  <text x="480" y="42" text-anchor="middle" class="title">采集画面判定标准</text>
  <rect x="70" y="82" width="380" height="286" class="frame"/>
  <rect x="168" y="136" width="186" height="132" fill="#fff" stroke="#eee"/>
  <g transform="translate(186,150)">
    <rect width="150" height="100" fill="#fff" stroke="#222"/>
    <rect x="0" y="0" width="15" height="15" class="marker"/><rect x="30" y="0" width="15" height="15" class="marker"/><rect x="60" y="0" width="15" height="15" class="marker"/><rect x="90" y="0" width="15" height="15" class="marker"/><rect x="120" y="0" width="15" height="15" class="marker"/>
    <rect x="15" y="20" width="15" height="15" class="marker"/><rect x="45" y="20" width="15" height="15" class="marker"/><rect x="75" y="20" width="15" height="15" class="marker"/><rect x="105" y="20" width="15" height="15" class="marker"/><rect x="135" y="20" width="15" height="15" class="marker"/>
    <rect x="0" y="60" width="15" height="15" class="marker"/><rect x="30" y="60" width="15" height="15" class="marker"/><rect x="60" y="60" width="15" height="15" class="marker"/><rect x="90" y="60" width="15" height="15" class="marker"/><rect x="120" y="60" width="15" height="15" class="marker"/>
    <rect x="15" y="85" width="15" height="15" class="marker"/><rect x="45" y="85" width="15" height="15" class="marker"/><rect x="75" y="85" width="15" height="15" class="marker"/><rect x="105" y="85" width="15" height="15" class="marker"/>
  </g>
  <circle cx="210" cy="172" r="4" class="green"/><circle cx="245" cy="172" r="4" class="green"/><circle cx="280" cy="172" r="4" class="green"/><circle cx="315" cy="172" r="4" class="green"/>
  <circle cx="210" cy="210" r="4" class="green"/><circle cx="245" cy="210" r="4" class="green"/><circle cx="280" cy="210" r="4" class="green"/><circle cx="315" cy="210" r="4" class="green"/>
  <text x="260" y="324" text-anchor="middle" fill="#8be28a" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18">charuco=xx rms=0.xx px</text>
  <rect x="70" y="390" width="380" height="74" class="ok"/>
  <text x="260" y="420" text-anchor="middle" class="text">可以采集</text>
  <text x="260" y="446" text-anchor="middle" class="small">板子完整、清晰，绿色角点稳定，状态没有报错</text>
  <rect x="510" y="82" width="380" height="286" class="frame"/>
  <rect x="550" y="112" width="170" height="124" fill="#fff" stroke="#eee" opacity="0.55"/>
  <text x="700" y="180" text-anchor="middle" fill="#eaa" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20">模糊 / 只看到一部分 / 反光</text>
  <text x="700" y="320" text-anchor="middle" fill="#eaa" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18">no aruco markers detected</text>
  <rect x="510" y="390" width="380" height="74" class="bad"/>
  <text x="700" y="420" text-anchor="middle" class="text">暂不采集</text>
  <text x="700" y="446" text-anchor="middle" class="small">调整距离、光照和角度，等检测稳定后再点采集</text>
</svg>
